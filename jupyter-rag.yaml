apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyter-workspace
  namespace: rag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: longhorn

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-rag
  namespace: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-rag
  template:
    metadata:
      labels:
        app: jupyter-rag
    spec:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jupyter
          image: quay.io/jupyter/base-notebook:latest
          ports:
            - containerPort: 8888
              name: http
          env:
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
          command:
            - start-notebook.py
            - --ServerApp.ip=0.0.0.0
            - --ServerApp.port=8888
            - --ServerApp.allow_remote_access=True
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /home/jovyan/work
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: jupyter-workspace

---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-rag
  namespace: rag
spec:
  type: ClusterIP
  selector:
    app: jupyter-rag
  ports:
    - name: http
      port: 8888
      targetPort: 8888
